name: Build Chadnotes APK (Release R8 + Signed)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-chadnotes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK, NDK 27.0.12077973 & CMake 3.22.1
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973 cmake;3.22.1"

      - name: Prepare Persistent Release Keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD || 'chadnotes2026' }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'chadnotes_key' }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD || 'chadnotes2026' }}
        run: |
          mkdir -p .github/signing
          KEYSTORE_PATH=".github/signing/chadnotes-release.jks"

          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            echo "$SECRET_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          elif [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Chadnotes, OU=Mobile, O=ChadnotesFork, L=Chennai, ST=TN, C=IN"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f "$KEYSTORE_PATH"
            git commit -m "chore: persist Chadnotes release keystore [skip ci]" || true
            git push || true
          fi

      - name: Apply Chadnotes Branding, GigaChad Icon & Dependencies
        run: |
          chmod +x ./apply-chadnotes-patch.sh
          ./apply-chadnotes-patch.sh

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Compile & Sign Chadnotes Release APK (R8 Optimized)
        env:
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD || 'chadnotes2026' }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'chadnotes_key' }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD || 'chadnotes2026' }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/.github/signing/chadnotes-release.jks" \
            -Pandroid.injected.signing.store.password="${STORE_PASS}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASS}" \
            --stacktrace

      - name: Verify & Package Chadnotes APK
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$RELEASE_APK" "app/build/outputs/apk/release/Chadnotes-A-Xnotes-Fork.apk"
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner verify --verbose "app/build/outputs/apk/release/Chadnotes-A-Xnotes-Fork.apk"

      - name: Upload Chadnotes APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chadnotes-A-Xnotes-Fork-APK
          path: app/build/outputs/apk/release/Chadnotes-A-Xnotes-Fork.apk

      - name: Publish Chadnotes APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chadnotes-v0.9.5-${{ github.run_number }}
          name: "Chadnotes - A Xnotes Fork (Build #${{ github.run_number }})"
          body: |
            ### 🗿 Chadnotes - A Xnotes Fork (Signed R8 Release APK)
            * **App Name:** `Chadnotes- A Xnotes Fork`
            * **Package ID:** `com.chadnotes.xnotes` (Installs side-by-side with official XNotes)
            * **App Icon:** GigaChad Monochrome Edition
            * **Features Included:** Stylus Button & Double-Tap Remapper, Parametric & Cubic Bézier Pressure Curves, Scribble-to-Erase, Low-Latency Front Buffer + MotionEventPredictor, Edge-to-Edge Immersive Mode + Collapsible Floating Pill, Draggable Shape Vertices, and Multi-Note Tab Switcher.
          files: app/build/outputs/apk/release/Chadnotes-A-Xnotes-Fork.apk
